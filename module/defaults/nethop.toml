# NetHop user configuration
# Source IDs are daemon-owned and never belong in this file.
schema_version = 3

[service]
# Persistent proxy switch. The daemon remains available when disabled.
enabled = true

[subscriptions]
mode = "single"
auto_update = true
update_interval_hours = 24

[[subscriptions.sources]]
# User-visible name and HTTPS subscription URL.
name = "Primary"
enabled = true
url = ""
request_profile = "sing_box_android"
format_hint = "auto"
mirrors = []
# Optional source-local filters. Name matching is ASCII case-insensitive.
filter = { include_names = [], exclude_names = [], excluded_node_ids = [], protocols = [] }

[[subscriptions.sources]]
# Optional fallback source. Enable it only after setting a URL.
name = "Backup"
enabled = false
url = ""
request_profile = "sing_box_android"
format_hint = "auto"
mirrors = []
filter = { include_names = [], exclude_names = [], excluded_node_ids = [], protocols = [] }

[proxy]
outbound_mode = "rule"

[proxy.urltest]
interval_minutes = 10
tolerance_ms = 50
max_candidates = 64

[applications]
mode = "all"
# Each target is either { kind = "package", android_user_id = 0, package = "com.example.app" }
# or { kind = "uid", uid = 10123 }. Root is always excluded by the daemon.
targets = []

[network]
capture_mode = "auto"
proxy_tcp = true
proxy_udp = true
ipv6_mode = "auto"
dns_mode = "auto"
tun_stack = "gvisor"

[network.interfaces]
mobile = true
wifi = true
hotspot = false
usb = false
include = []
exclude = []

[network.wifi_scenes]
# Optional transient policy. The persistent service switch remains authoritative.
enabled = false
probe_interval_seconds = 30

# Example (SSID/BSSID are treated as sensitive values):
# [[network.wifi_scenes.rules]]
# id = "trusted-home"
# ssid = "Home Wi-Fi"
# action = "disable_proxy"

[routing]
bypass_private = true
bypass_cn = true
block_quic = false
force_proxy_cidrs = []
bypass_cidrs = []
force_proxy_domains = []
bypass_domains = []
block_domains = []

[logging]
level = "info"
retention_days = 7

[advanced]
inbound_port = 7893
bypass_mark = 131072
ipv6_guard = true
dry_run = false
health_timeout_seconds = 3
reconcile_interval_seconds = 60

[[advanced.resource_candidates]]
mark = 1313407232
mask = 4294967295
route_table = 100
rule_priority = 12000

[[advanced.resource_candidates]]
mark = 1313407488
mask = 4294967295
route_table = 101
rule_priority = 12010

[[advanced.resource_candidates]]
mark = 1313407744
mask = 4294967295
route_table = 102
rule_priority = 12020

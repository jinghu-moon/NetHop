[package]
name = "nethopd"
description = "Controlled daemon process boundaries for NetHop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
libc = "0.2"
nethop-android = { version = "0.1.0", path = "../nethop-android" }
nethop-core = { version = "0.1.0", path = "../nethop-core" }
nethop-protocol = { version = "0.1.0", path = "../nethop-protocol" }
serde_json = { version = "1", default-features = false, features = ["std"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

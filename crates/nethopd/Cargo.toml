[package]
name = "nethopd"
description = "Controlled daemon process boundaries for NetHop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["subscription-update"]
subscription-update = ["nethop-subscription/fetch", "nethop-subscription/format-surfboard"]
benchmark-evidence = []

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
getrandom = { version = "0.3", default-features = false }
libc = "0.2"
nethop-android = { version = "0.1.0", path = "../nethop-android" }
nethop-core = { version = "0.1.0", path = "../nethop-core" }
nethop-protocol = { version = "0.1.0", path = "../nethop-protocol" }
nethop-subscription = { version = "0.1.0", path = "../nethop-subscription", default-features = false, features = ["parser", "format-uri", "format-base64", "format-clash-yaml", "format-singbox-json"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
thiserror = "2"
toml = { version = "1.1.4", default-features = false, features = ["std", "serde", "parse", "display"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1", default-features = false }
ureq = { version = "=3.3.0", default-features = false }
url = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "subscription_candidate_probe"
required-features = ["subscription-update"]

[[example]]
name = "fair_pool_bench"
required-features = ["subscription-update"]

[[example]]
name = "node_benchmark_evidence"
required-features = ["benchmark-evidence"]

[[example]]
name = "node_benchmark_postprocess_evidence"
required-features = ["benchmark-evidence"]
